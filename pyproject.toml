[project]
name = "loan-servicing-ai"
version = "0.1.0"
description = "AI-powered loan servicing: text and voice assistant over enterprise systems"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "openai>=3.36.1",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.32.0",
    "aiosqlite>=0.22.1",
    "langfuse>=4.18.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.uv]
package = false
